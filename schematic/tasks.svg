</text><text x="510" y="243" text-anchor="middle" font-size="17" fill="#20364b">Quá 100 ms: bỏ</text><rect x="40" y="335" width="250" height="115" rx="14" fill="#fcecee" stroke="#ba4658" stroke-width="2"/><text x="165" y="368" text-anchor="middle" font-size="21" fill="#ba4658">STOP / Wi-Fi</text><text x="165" y="398" text-anchor="middle" font-size="17" fill="#20364b">Bit STOP ưu tiên</text><text x="165" y="423" text-anchor="middle" font-size="17" fill="#20364b">Disconnect báo sự kiện</text><rect x="40" y="495" width="250" height="110" rx="14" fill="#fff4d9" stroke="#ad873a" stroke-width="2"/><text x="165" y="528" text-anchor="middle" font-size="21" fill="#ad873a">ISR GPIO27</text><text x="165" y="558" text-anchor="middle" font-size="17" fill="#20364b">Chốt cạnh E-Stop</text><text x="165" y="583" text-anchor="middle" font-size="17" fill="#20364b">Không xử lý FSM</text><rect x="660" y="355" width="245" height="110" rx="14" fill="#e7f6ed" stroke="#358666" stroke-width="2"/><text x="782.5" y="388" text-anchor="middle" font-size="21" fill="#358666">Main task</text><text x="782.5" y="418" text-anchor="middle" font-size="17" fill="#20364b">FSM + interlock</text><text x="782.5" y="443" text-anchor="middle" font-size="17" fill="#20364b">USB Serial bounded</text><rect x="970" y="155" width="250" height="120" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="1095" y="188" text-anchor="middle" font-size="21" fill="#5782a3">LEDC / GPIO</text><text x="1095" y="218" text-anchor="middle" font-size="17" fill="#20364b">PWM 18 / 19 / 23 / 26</text><text x="1095" y="243" text-anchor="middle" font-size="17" fill="#20364b">LED 25 / 32 / 33</text><rect x="970" y="510" width="250" height="110" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="1095" y="543" text-anchor="middle" font-size="21" fill="#5782a3">Snapshot</text><text x="1095" y="573" text-anchor="middle" font-size="17" fill="#20364b">Khóa ngắn khi copy</text><text x="1095" y="598" text-anchor="mi