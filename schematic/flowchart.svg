<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Flowchart • vòng điều khiển ESP-IDF C"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#507089"/></marker></defs><rect width="1200" height="1200" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="48" text-anchor="start" font-size="30" fill="#132e43">Flowchart • vòng điều khiển ESP-IDF C</text><text x="40" y="81" text-anchor="start" font-size="17" fill="#547083">Một main task sở hữu FSM/PWM; không chờ HTTP hoặc Serial newline.</text><path d="M 580 205 V 235" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 860 300 H 950" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 580 365 V 445" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 1055 360 V 410 H 580 V 445" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 580 535 V 585" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 580 685 V 735" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 580 845 V 885" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 580 975 V 1035" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 300 1080 H 220 V 300 H 300" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="300" y="115" width="560" height="90" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="580" y="148" text-anchor="middle" font-size="21" fill="#5782a3">Khởi tạo</text><text x="580" y="178" text-anchor="middle" font-size="17" fill="#20364b">Đích dừng → STOPPED → Wi-Fi → watchdog</text><path d="M 580 235 L 860 300 L 580 365 L 300 300 Z" fill="#fff4d9" stroke="#ad873a" stroke-width="2"/><text x="580" y="292" text-anchor="middle" font-size="20" fill="#20364b">E-Stop / ADC / pin / driver</text><text x="580" y="321" text-anchor="middle" font-size="20" fill="#20364b">hoặc timeout có lỗi?</text><text x="903" y="283" text-anchor="middle" font-size="17" fill="#20364b">Có</text><text x="614" y="397" text-anchor="middle" font-size="17" fill="#20364b">Không</text><rect x="950" y="260" width="210" height="100" rx="14" fill="#fcecee" stroke="#ba4658" stroke-width="2"/><text x="1055" y="293" text-anchor="middle" font-size="21" fill="#ba4658">STOPPED</text><text x="1055" y="323" text-anchor="middle" font-size="17" fill="#20364b">Đích dừng</text><text x="1055" y="348" text-anchor="middle" font-size="17" fill="#20364b">Tăng epoch</text><rect x="300" y="445" width="560" height="90" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="580" y="478" text-anchor="middle" font-size="21" fill="#5782a3">USB Serial</text><text x="580" y="508" text-anchor="middle" font-size="17" fill="#20364b">Tối đa 32 byte/lần; kiểm tra safety khi đọc</text><rect x="300" y="585" width="560" height="100" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="580" y="618" text-anchor="middle" font-size="21" fill="#5782a3">Điện thoại</text><text x="580" y="648" text-anchor="middle" font-size="17" fill="#20364b">Bit STOP / disconnect trước queue</text><text x="580" y="673" text-anchor="middle" font-size="17" fill="#20364b">Tối đa 4 lệnh; loại lệnh quá tuổi / epoch cũ</text><rect x="300" y="735" width="560" height="110" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="580" y="768" text-anchor="middle" font-size="21" fill="#5782a3">Chấp nhận hoặc từ chối lệnh</text><text x="580" y="798" text-anchor="middle" font-size="17" fill="#20364b">Kiểm tra safety, FSM, owner, sequence, cú pháp</text><text x="580" y="823" text-anchor="middle" font-size="17" fill="#20364b">Chỉ lệnh hợp lệ gia hạn heartbeat</text><rect x="300" y="885" width="560" height="90" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="580" y="918" text-anchor="middle" font-size="21" fill="#5782a3">Safety và Serial lần nữa</text><text x="580" y="948" text-anchor="middle" font-size="17" fill="#20364b">Cập nhật đích PWM / LED từ cùng một task</text><rect x="300" y="1035" width="560" height="90" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="580" y="1068" text-anchor="middle" font-size="21" fill="#5782a3">Kết thúc vòng</text><text x="580" y="1098" text-anchor="middle" font-size="17" fill="#20364b">TX không chờ → reset watchdog → yield 1 tick</text><text x="110" y="560" text-anchor="middle" font-size="19" fill="#20364b">Lặp lại</text><text x="110" y="590" text-anchor="middle" font-size="17" fill="#20364b">Tick 1 ms</text><text x="110" y="620" text-anchor="middle" font-size="16" fill="#20364b">không phải</text><text x="110" y="645" text-anchor="middle" font-size="16" fill="#20364b">cam kết độ trễ</text><text x="40" y="1176" text-anchor="start" font-size="15" fill="#647687">ESP32 Hybrid Minicar • Bản thử bàn • Chưa xác nhận vận hành xe thi</text></g></svg>