<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="FSM • STOPPED / ARMED / RUNNING"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#507089"/></marker></defs><rect width="1200" height="590" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="48" text-anchor="start" font-size="30" fill="#132e43">FSM • STOPPED / ARMED / RUNNING</text><text x="40" y="81" text-anchor="start" font-size="17" fill="#547083">GPIO giữ nguyên. Đầu ra bên dưới là đích thử, chưa chứng minh cơ cấu thật an toàn.</text><path d="M 340 280 H 455" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 745 280 H 860" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 1005 210 V 150 H 195 V 210" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 600 210 V 150 H 195 V 210" fill="none" stroke="#507089" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="600" y="128" text-anchor="middle" font-size="19" fill="#20364b">STOP / E-Stop / pin thấp / lỗi • RUNNING thêm timeout</text><text x="398" y="256" text-anchor="middle" font-size="17" fill="#20364b">ARM</text><text x="802" y="256" text-anchor="middle" font-size="17" fill="#20364b">RUN</text><rect x="50" y="210" width="290" height="145" rx="14" fill="#fcecee" stroke="#ba4658" stroke-width="2"/><text x="195" y="243" text-anchor="middle" font-size="21" fill="#ba4658">STOPPED</text><text x="195" y="273" text-anchor="middle" font-size="17" fill="#20364b">Ga 0° · lái 90°</text><text x="195" y="298" text-anchor="middle" font-size="17" fill="#20364b">ESC / GPIO26: 1000 µs</text><text x="195" y="323" text-anchor="middle" font-size="17" fill="#20364b">LED đỏ</text><rect x="455" y="210" width="290" height="145" rx="14" fill="#e7f6ed" stroke="#358666" stroke-width="2"/><text x="600" y="243" text-anchor="middle" font-size="21" fill="#358666">ARMED</text><text x="600" y="273" text-anchor="middle" font-size="17" fill="#20364b">Đầu ra giữ idle</text><text x="600" y="298" text-anchor="middle" font-size="17" fill="#20364b">RUN chỉ từ nguồn đã ARM</text><text x="600" y="323" text-anchor="middle" font-size="17" fill="#20364b">LED xanh</text><rect x="860" y="210" width="290" height="145" rx="14" fill="#fff4d9" stroke="#ad873a" stroke-width="2"/><text x="1005" y="243" text-anchor="middle" font-size="21" fill="#ad873a">RUNNING</text><text x="1005" y="273" text-anchor="middle" font-size="17" fill="#20364b">STEER / GAS / ESC</text><text x="1005" y="298" text-anchor="middle" font-size="17" fill="#20364b">GPIO26 test: 1500 µs</text><text x="1005" y="323" text-anchor="middle" font-size="17" fill="#20364b">LED vàng</text><text x="195" y="390" text-anchor="middle" font-size="18" fill="#20364b">Boot / reset → STOPPED</text><text x="1005" y="390" text-anchor="middle" font-size="17" fill="#20364b">Lệnh hợp lệ gia hạn heartbeat</text><rect x="50" y="430" width="1100" height="100" rx="14" fill="#eef1f4" stroke="#7b8795" stroke-width="2"/><text x="600" y="463" text-anchor="middle" font-size="21" fill="#7b8795">Timeout: ESP-IDF 500 ms • Wokwi 5000 ms</text><text x="600" y="493" text-anchor="middle" font-size="17" fill="#20364b">Hết hạn → dừng; PING không tự chạy lại. Cần ARM rồi RUN mới. GPIO26 chỉ là PWM test.</text><text x="40" y="566" text-anchor="start" font-size="15" fill="#647687">ESP32 Hybrid Minicar • Bản thử bàn • Chưa xác nhận vận hành xe thi</text></g></svg>