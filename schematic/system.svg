483" text-anchor="middle" font-size="17" fill="#20364b">GPIO23; analyzer D0</text><text x="1225" y="508" text-anchor="middle" font-size="17" fill="#20364b">Xác minh ESC trước tải</text><rect x="1090" y="565" width="270" height="105" rx="14" fill="#fff4d9" stroke="#ad873a" stroke-width="2"/><text x="1225" y="598" text-anchor="middle" font-size="21" fill="#ad873a">Analyzer D1</text><text x="1225" y="628" text-anchor="middle" font-size="17" fill="#20364b">GPIO26 test ONLY</text><text x="1225" y="653" text-anchor="middle" font-size="17" fill="#20364b">Chưa nối ignition</text><rect x="1090" y="710" width="270" height="95" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="1225" y="743" text-anchor="middle" font-size="21" fill="#5782a3">Ba LED</text><text x="1225" y="773" text-anchor="middle" font-size="17" fill="#20364b">220–330 Ω mỗi LED</text><rect x="40" y="805" width="270" height="115" rx="14" fill="#fff4d9" stroke="#ad873a" stroke-width="2"/><text x="175" y="838" text-anchor="middle" font-size="21" fill="#ad873a">LiPo 3S</text><text x="175" y="868" text-anchor="middle" font-size="17" fill="#20364b">Tối đa 12.6 V</text><text x="175" y="893" text-anchor="middle" font-size="17" fill="#20364b">Cầu chì / phân phối theo tải</text><rect x="550" y="805" width="300" height="115" rx="14" fill="#eaf2f9" stroke="#5782a3" stroke-width="2"/><text x="700" y="838" text-anchor="middle" font-size="21" fill="#5782a3">Nguồn servo</text><text x="700" y="868" text-anchor="middle" font-size="17" fill="#20364b">Buck/BEC đúng model</text><text x="700" y="893" text-anchor="middle" font-size="17" fill="#20364b">Không song song hai đầu ra</text><rect x="550" y="975" width="300" height="90" rx="14" fill="#fcecee" stroke="#ba4658" stroke-width="2"/><text x="700" y="1008" text-anchor="middle" font-size="21" fill="#ba4658">Kill độc lập</text><text x="700" y="1038" text-anchor="middle" font-size="17" fill="#20364b">Chưa chốt theo ignition</text><rect x="1090" y="975" width="270" hei